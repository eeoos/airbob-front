name: Frontend

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install deterministic browser
        run: npx playwright install --with-deps chromium

      - name: Verify browser artifact privacy policy
        run: npm run test:e2e:artifact-policy

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck browser characterization
        run: npm run typecheck:e2e

      - name: Test
        run: npm run test:ci:no-cache -- --runInBand

      - name: Build
        run: npm run build

      - name: Browser characterization
        run: npm run test:e2e:characterization

      - name: Strict lint
        run: npm run lint:strict

      - name: Browser characterization lint
        run: npm run lint:e2e
