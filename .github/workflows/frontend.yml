name: Frontend

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", "24.0.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install deterministic browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify backend-independent redesign readiness
        run: npm run verify:design-ready
        env:
          AIRBOB_PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
